spring.application.name=seeder
spring.main.web-application-type=none
spring.main.banner-mode=off

# Per-domain DataSource URLs (override per env)
seed.db.identity-url=jdbc:postgresql://user-db:5432/user_service
seed.db.role-url=jdbc:postgresql://role-db:5432/role_service
seed.db.merchant-url=jdbc:postgresql://merchant-db:5432/merchant_service
seed.db.merchant-award-url=jdbc:postgresql://merchant-award-db:5432/merchant_award_service
seed.db.merchant-business-url=jdbc:postgresql://merchant-business-db:5432/merchant_business_service
seed.db.merchant-detail-url=jdbc:postgresql://merchant-detail-db:5432/merchant_detail_service
seed.db.merchant-policy-url=jdbc:postgresql://merchant-policy-db:5432/merchant_policy_service
seed.db.category-url=jdbc:postgresql://category-db:5432/category_service
seed.db.banner-url=jdbc:postgresql://banner-db:5432/banner_service
seed.db.slider-url=jdbc:postgresql://slider-db:5432/slider_service
seed.db.product-url=jdbc:postgresql://product-db:5432/product_service
seed.db.cart-url=jdbc:postgresql://cart-db:5432/cart_service
seed.db.order-url=jdbc:postgresql://order-db:5432/spring-order-service
seed.db.order-item-url=jdbc:postgresql://order-item-db:5432/order_item_service
seed.db.transaction-url=jdbc:postgresql://transaction-db:5432/transaction_service
seed.db.review-url=jdbc:postgresql://review-db:5432/review_service
seed.db.review-detail-url=jdbc:postgresql://review-detail-db:5432/review_detail_service
seed.db.shipping-address-url=jdbc:postgresql://shipping-address-db:5432/shipping_address_service
seed.db.username=postgres
seed.db.password=password

# Filter: comma-separated domain names, e.g. SEED_DOMAINS=identity,merchant
seed.domains=

# OpenTelemetry
otel.service.name=seeder
otel.exporter.otlp.endpoint=http://otel-collector:4317
otel.traces.sampler=parentbased_always_on